name: PR 46 benchmark diagnostics

on:
  push:
    branches: [issue-23-quality-benchmarks]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-23-quality-benchmarks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Print benchmark failures
        run: |
          python - <<'PY'
          from pathlib import Path
          from commercelens.quality.benchmarks import build_quality_report, run_benchmark_suite

          fixture_dir = Path("tests/fixtures/benchmarks")
          suite = run_benchmark_suite(fixture_dir)
          print(f"suite score={suite.score:.6f} passed_cases={suite.passed_cases}/{suite.total_cases}")
          for case in suite.cases:
              if not case.passed:
                  print(f"FAIL CASE: {case.name}")
                  for field, values in case.failures.items():
                      print(f"  {field}: expected={values.get('expected')!r} actual={values.get('actual')!r}")
          report = build_quality_report(fixture_dir)
          print("gate failures:")
          for failure in report.gate_failures:
              print(f"  {failure}")
          print(f"price_accuracy={report.price_accuracy:.6f}")
          print(f"availability_accuracy={report.availability_accuracy:.6f}")
          print(f"product_field_accuracy={report.product_field_accuracy:.6f}")
          print(f"listing_recall={report.listing_recall:.6f}")
          PY
