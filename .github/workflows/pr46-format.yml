name: PR 46 formatter

on:
  push:
    branches: [issue-23-quality-benchmarks]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-23-quality-benchmarks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.4'

      - name: Apply repository formatting
        run: ruff format commercelens/quality/benchmarks.py tests/test_benchmarks.py

      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/pr46-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commercelens/quality/benchmarks.py tests/test_benchmarks.py
          git commit -m "Format extraction quality benchmark changes"
          git push origin HEAD:issue-23-quality-benchmarks
