name: PR 46 CI fixes

on:
  push:
    branches: [issue-23-quality-benchmarks]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-23-quality-benchmarks

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply extractor and typing fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          benchmarks = Path("commercelens/quality/benchmarks.py")
          text = benchmarks.read_text()
          old = '''    started = perf_counter()
          if expectation.kind == "product":
              extracted_model = extract_product_from_html(html, url=expectation.source_url)
          else:
              extracted_model = extract_listing_from_html(html, url=expectation.source_url)
          latency_ms = (perf_counter() - started) * 1000
          extracted = extracted_model.model_dump(mode="json")
          '''
          new = '''    started = perf_counter()
          if expectation.kind == "product":
              extracted = extract_product_from_html(
                  html, url=expectation.source_url
              ).model_dump(mode="json")
          else:
              extracted = extract_listing_from_html(
                  html, url=expectation.source_url
              ).model_dump(mode="json")
          latency_ms = (perf_counter() - started) * 1000
          '''
          if old not in text:
              raise SystemExit("benchmark extraction block not found")
          text = text.replace(old, new, 1)
          old = '''        for item in raw:
              case = BenchmarkManifestCase.model_validate(item)
              expectations[case.name] = case.fields
          '''
          new = '''        for item in raw:
              manifest_case = BenchmarkManifestCase.model_validate(item)
              expectations[manifest_case.name] = manifest_case.fields
          '''
          if old not in text:
              raise SystemExit("benchmark manifest block not found")
          benchmarks.write_text(text.replace(old, new, 1))

          price = Path("commercelens/extractors/price.py")
          text = price.read_text()
          old = '''    r"(?P<amount>[0-9]{1,3}(?:,[0-9]{3})*(?:\\.[0-9]{1,2})?|[0-9]+(?:\\.[0-9]{1,2})?)",
          '''
          new = '''    r"(?P<amount>(?:[0-9]{1,3}(?:,[0-9]{3})+|[0-9]+)(?:\\.[0-9]{1,2})?)",
          '''
          if old not in text:
              raise SystemExit("price regex block not found")
          price.write_text(text.replace(old, new, 1))

          availability = Path("commercelens/extractors/availability.py")
          text = availability.read_text()
          if "import re\n" not in text:
              text = text.replace(
                  "from __future__ import annotations\n\n",
                  "from __future__ import annotations\n\nimport re\n\n",
                  1,
              )
          old = '''    text = " ".join(raw.lower().split())
          '''
          new = '''    separated = re.sub(r"(?<=[a-z0-9])(?=[A-Z])", " ", raw)
              text = " ".join(separated.lower().split())
          '''
          if old not in text:
              raise SystemExit("availability normalization block not found")
          availability.write_text(text.replace(old, new, 1))
          PY

      - name: Add normalization regression tests
        run: |
          cat > tests/test_extractor_normalization.py <<'PY'
          from __future__ import annotations

          import pytest

          from commercelens.extractors.availability import normalize_availability
          from commercelens.extractors.price import parse_price


          @pytest.mark.parametrize(
              ("raw", "expected"),
              [
                  ("https://schema.org/InStock", "in_stock"),
                  ("https://schema.org/OutOfStock", "out_of_stock"),
                  ("https://schema.org/PreOrder", "preorder"),
                  ("https://schema.org/BackOrder", "backorder"),
              ],
          )
          def test_normalize_availability_handles_schema_camel_case(raw: str, expected: str) -> None:
              assert normalize_availability(raw).value == expected


          @pytest.mark.parametrize(
              ("raw", "currency", "expected_amount"),
              [
                  ("12000", "JPY", 12000.0),
                  ("1,200", "USD", 1200.0),
                  ("1200.50", "USD", 1200.5),
              ],
          )
          def test_parse_price_preserves_full_integer_amount(
              raw: str, currency: str, expected_amount: float
          ) -> None:
              price = parse_price(raw, default_currency=currency)
              assert price is not None
              assert price.amount == expected_amount
              assert price.currency == currency
          PY

      - name: Remove temporary workflows
        run: |
          rm -f .github/workflows/pr46-diagnostics.yml
          rm -f .github/workflows/pr46-fix.yml

      - name: Install validation dependencies
        run: python -m pip install -e ".[dev]"

      - name: Format
        run: ruff format commercelens/quality/benchmarks.py commercelens/extractors/price.py commercelens/extractors/availability.py tests/test_benchmarks.py tests/test_extractor_normalization.py

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy commercelens

      - name: Run focused tests
        run: pytest tests/test_benchmarks.py tests/test_extractor_normalization.py -q

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix extraction quality gate regressions"
          git push origin HEAD:issue-23-quality-benchmarks
