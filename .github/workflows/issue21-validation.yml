name: Issue 21 validation

on:
  push:
    branches: [issue-21-portal-onboarding]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-21-portal-onboarding

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Format branch
        run: ruff format .

      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Format issue 21 portal changes"
          git push origin HEAD:issue-21-portal-onboarding

  test:
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout formatted feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-21-portal-onboarding

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy commercelens

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml -q

  package:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatted feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-21-portal-onboarding
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build distributions
        run: python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Smoke test installed wheel
        run: |
          wheel_root="$(mktemp -d)"
          python -m venv "$wheel_root/venv"
          "$wheel_root/venv/bin/python" -m pip install dist/*.whl
          cd "$wheel_root"
          "$wheel_root/venv/bin/commercelens" --help
          "$wheel_root/venv/bin/commercelens" html \
            "$GITHUB_WORKSPACE/tests/fixtures/benchmarks/product_jsonld.html" \
            --out "$wheel_root/product.json"
          "$wheel_root/venv/bin/python" -c \
            'import json, pathlib; data=json.loads(pathlib.Path("product.json").read_text()); assert data["product"]["name"]'

  postgres:
    needs: format
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: commercelens
          POSTGRES_PASSWORD: commercelens
          POSTGRES_USER: commercelens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commercelens -d commercelens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout formatted feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-21-portal-onboarding
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Postgres test dependencies
        run: python -m pip install -e ".[dev,postgres]"
      - name: Run Postgres integration tests
        env:
          COMMERCELENS_TEST_POSTGRES_DSN: postgresql://commercelens:commercelens@127.0.0.1:5432/commercelens
        run: pytest tests/test_postgres_integration.py -q

  browser:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatted feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-21-portal-onboarding
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install browser test dependencies
        run: |
          python -m pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium
      - name: Run deterministic browser fixture test
        env:
          COMMERCELENS_RUN_BROWSER_TESTS: "1"
        run: pytest tests/test_browser_integration.py -q

  docker:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout formatted feature branch
        uses: actions/checkout@v7
        with:
          ref: issue-21-portal-onboarding
      - name: Build image
        run: docker build --tag commercelens:ci .
      - name: Smoke test readiness
        run: |
          container_name="commercelens-ci-${GITHUB_RUN_ID}"
          docker run --detach --name "$container_name" --publish 127.0.0.1:8000:8000 commercelens:ci
          trap 'docker rm --force "$container_name" >/dev/null 2>&1' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1
