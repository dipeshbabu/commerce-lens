name: Issue 19 type fix

on:
  push:
    branches: [issue-19-domain-models]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-19-domain-models
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Normalize SQLite repository path type
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("commercelens/domain/repository.py")
          text = path.read_text()
          old = '    path = getattr(store, "path", None)\n    return SQLiteDomainRepository(path or os.getenv("COMMERCELENS_JOBS_DB", "commercelens_jobs.db"))\n'
          new = '    path = getattr(store, "path", None)\n    sqlite_path = str(path) if path is not None else os.getenv("COMMERCELENS_JOBS_DB", "commercelens_jobs.db")\n    return SQLiteDomainRepository(sqlite_path)\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("repository path anchor not found")
          path.write_text(text)
          PY
      - name: Format and validate type fix
        run: |
          python -m pip install -e ".[dev]"
          ruff format commercelens/domain/repository.py
          ruff check .
          ruff format --check .
          mypy commercelens
          pytest tests/test_domain_models.py tests/test_domain_api.py tests/test_domain_extraction_api.py -q
      - name: Commit type fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commercelens/domain/repository.py
          git commit -m "Fix domain repository path typing"
          git push origin HEAD:issue-19-domain-models
