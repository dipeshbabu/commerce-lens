name: Issue 24 diagnostics

on:
  push:
    branches: [issue-24-matching-evaluation]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-24-matching-evaluation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Print before and after matching evaluation
        run: |
          python - <<'PY'
          from difflib import SequenceMatcher
          from pathlib import Path
          from urllib.parse import urlparse

          from commercelens.matching.evaluation import (
              DEFAULT_EVALUATION_THRESHOLDS,
              evaluate_matching_cases,
              load_matching_cases,
          )
          from commercelens.matching.products import normalize_text, token_set

          cases = load_matching_cases(Path("tests/fixtures/matching/evaluation.json"))

          def legacy_score(left, right):
              score = 0.0
              left_name = normalize_text(left.name)
              right_name = normalize_text(right.name)
              if left_name and right_name:
                  score += 0.55 * SequenceMatcher(None, left_name, right_name).ratio()
              left_tokens = token_set(left.name)
              right_tokens = token_set(right.name)
              if left_tokens and right_tokens:
                  score += 0.2 * len(left_tokens & right_tokens) / len(left_tokens | right_tokens)
              left_brand = normalize_text(left.brand)
              right_brand = normalize_text(right.brand)
              if left_brand and right_brand:
                  score += 0.15 if left_brand == right_brand else -0.05
              if left.currency and right.currency and left.currency.upper() == right.currency.upper():
                  score += 0.03
              if left.amount is not None and right.amount is not None and max(left.amount, right.amount) > 0:
                  gap = abs(left.amount - right.amount) / max(left.amount, right.amount)
                  if gap <= 0.1:
                      score += 0.05
                  elif gap > 0.5:
                      score -= 0.03
              def domain(url):
                  if not url:
                      return ""
                  return urlparse(url).netloc.lower().removeprefix("www.")
              left_domain = domain(left.url)
              right_domain = domain(right.url)
              if left_domain and right_domain and left_domain == right_domain:
                  score += 0.02
              return max(0.0, min(1.0, score))

          print("BEFORE")
          for threshold in DEFAULT_EVALUATION_THRESHOLDS:
              tp = fp = tn = fn = 0
              for case in cases:
                  predicted = legacy_score(case.left, case.right) >= threshold
                  if predicted and case.matched:
                      tp += 1
                  elif predicted and not case.matched:
                      fp += 1
                  elif not predicted and not case.matched:
                      tn += 1
                  else:
                      fn += 1
              precision = tp / (tp + fp) if tp + fp else 1.0
              recall = tp / (tp + fn) if tp + fn else 1.0
              f1 = 2 * precision * recall / (precision + recall) if precision + recall else 0.0
              fmr = fp / (fp + tn) if fp + tn else 0.0
              print(threshold, {"tp":tp,"fp":fp,"tn":tn,"fn":fn,"precision":precision,"recall":recall,"f1":f1,"false_match_rate":fmr})

          print("AFTER")
          print(evaluate_matching_cases(cases).model_dump_json(indent=2))
          PY
      - name: Lint
        run: ruff check commercelens/matching commercelens/api/matching_corrections.py tests/test_matching_evaluation.py tests/test_matching_corrections.py
      - name: Format check
        run: ruff format --check commercelens/matching commercelens/api/matching_corrections.py tests/test_matching_evaluation.py tests/test_matching_corrections.py
      - name: Type check
        run: mypy commercelens
      - name: Focused tests
        run: pytest tests/test_matching_evaluation.py tests/test_matching_corrections.py -q
