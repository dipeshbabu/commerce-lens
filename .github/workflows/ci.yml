name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy commercelens

      - name: Test with coverage
        run: pytest --cov --cov-report=term-missing -q

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Smoke test installed wheel
        run: |
          wheel_root="$(mktemp -d)"
          python -m venv "$wheel_root/venv"
          "$wheel_root/venv/bin/python" -m pip install dist/*.whl
          cd "$wheel_root"
          "$wheel_root/venv/bin/commercelens" --help
          "$wheel_root/venv/bin/commercelens" html \
            "$GITHUB_WORKSPACE/tests/fixtures/benchmarks/product_jsonld.html" \
            --out "$wheel_root/product.json"
          "$wheel_root/venv/bin/python" -c \
            'import json, pathlib; data=json.loads(pathlib.Path("product.json").read_text()); assert data["product"]["name"]'

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: Python distributions
          path: dist/*
          if-no-files-found: error
